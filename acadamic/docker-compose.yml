services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AI_PROVIDER=keyword
      - PORT=3000
      - NODE_ENV=development

