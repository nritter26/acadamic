[package]
name = "kodex-api"
version = "0.1.0"
edition = "2021"

[dependencies]
kodex-core = { path = "../kodex-core" }
kodex-sql = { path = "../kodex-sql", features = ["postgres", "mysql"] }
kodex-executor = { path = "../kodex-executor" }
kodex-ai = { path = "../kodex-ai" }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
bcrypt = { workspace = true }
tokio-stream = { workspace = true }
