services:
  rust-backend:
    build:
      context: ./backend/rust
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - AI_PROVIDER=keyword
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ./data:/app/data
      - ./curriculum:/app/curriculum

  node-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - AI_PROVIDER=keyword
      - PORT=3000
      - NODE_ENV=development
    volumes:
      - .:/code
    profiles:
      - fallback

  scala-runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.scala
    volumes:
      - .:/code
    environment:
      - PORT=3000

