<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doge's Lab: Full Mastery Edition</title>
    <style>
        :root {
            --bg: #020617; --card: #1e293b; --js: #f7df1e;
            --ts: #3178c6; --go: #00add8; --py: #3776ab; 
            --pg: #336791; --dk: #2496ed; --zig: #f7a41d;
            --text: #f1f5f9; --accent: var(--js);
        }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; padding: 15px; box-sizing: border-box; overflow: hidden; }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 15px; border-bottom: 1px solid #334155; }
        .selector { display: flex; gap: 8px; flex-wrap: wrap; }
        .selector button { background: #1e293b; color: #94a3b8; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: 800; transition: 0.2s; }
        .selector button.active { background: var(--accent); color: #000; border-color: var(--accent); }
        main { display: grid; grid-template-columns: 240px 380px 1fr 1fr; gap: 15px; flex: 1; padding-top: 15px; min-height: 0; }
        .col { background: var(--card); border-radius: 12px; padding: 15px; display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05); }
        label { font-size: 10px; font-weight: 900; color: #64748b; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 1.5px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .scroll { overflow-y: auto; flex: 1; padding-right: 5px; }
        .item-btn { display: block; width: 100%; text-align: left; background: rgba(255,255,255,0.03); border: none; color: #94a3b8; padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 11px; line-height: 1.4; }
        .item-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .item-btn.active-topic { background: rgba(255,255,255,0.15); border-left: 3px solid var(--accent); color: #fff; }
        .phase-label { font-size: 9px; color: #475569; font-weight: 800; margin: 15px 0 8px 0; display: block; text-transform: uppercase; border-left: 2px solid #334155; padding-left: 5px; }
        textarea { background: #000; color: #a5f3fc; border: 1px solid #334155; border-radius: 8px; padding: 15px; font-family: 'Consolas', monospace; flex: 1; resize: none; outline: none; font-size: 13px; line-height: 1.6; }
        #output { background: #000; color: #10b981; padding: 15px; font-family: 'Consolas', monospace; border-radius: 8px; flex: 1; white-space: pre-wrap; font-size: 12px; overflow-y: auto; border: 1px solid #1e293b; }
        .run-btn { background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 10px; font-weight: 900; cursor: pointer; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .ts-mode { --accent: var(--ts); } .py-mode { --accent: var(--py); } .go-mode { --accent: var(--go); } .pg-mode { --accent: var(--pg); } .dk-mode { --accent: var(--dk); } .zig-mode { --accent: var(--zig); } .cs-mode { --accent: #9b5de5; }
    </style>
</head>
<body id="app" class="js-mode">
<header>
    <div style="font-weight:900; font-size:22px;">DOGE'S <span style="color:var(--accent)" id="header-title">LAB</span></div>
    <div class="selector">
        <button id="nav-js" onclick="setMode('js')" class="active">JS</button>
        <button id="nav-ts" onclick="setMode('ts')">TS</button>
        <button id="nav-py" onclick="setMode('py')">PY</button>
        <button id="nav-go" onclick="setMode('go')">GO</button>
        <button id="nav-zig" onclick="setMode('zig')">ZIG</button>
        <button id="nav-pg" onclick="setMode('pg')">PG</button>
        <button id="nav-dk" onclick="setMode('dk')">DK</button>
        <button id="nav-cs" onclick="setMode('cs')">CS</button>
    </div>
</header>
<main>
    <div class="col"><label>Curriculum</label><div id="topic-list" class="scroll"></div></div>
    <div class="col"><label>Theory</label><div id="explanation" class="scroll"></div></div>
    <div class="col"><label>Workspace</label><textarea id="editor" spellcheck="false"></textarea><button class="run-btn" onclick="runCode()">Run ▶</button></div>
    <div class="col"><label>Console</label><div id="output" class="scroll"></div></div>
</main>

let currentLang = 'js';

function setMode(lang) {
    currentLang = lang;
    document.getElementById('app').className = lang + '-mode';
    document.getElementById('header-title').innerText = lang.toUpperCase();
    document.querySelectorAll('.selector button').forEach(b => b.classList.remove('active'));
    document.getElementById('nav-' + lang).classList.add('active');

    const langData = courseData[lang] || {};
    let html = "";
    for (let phase in langData) {
        html += `<span class="phase-label">${phase}</span>`;
        for (let topic in langData[phase]) {
            html += `<button class="item-btn" id="btn-${topic.replace(/\s/g, '').replace(/[&,]/g, '')}" onclick="loadTopic('${phase}', '${topic}')">${topic}</button>`;
        }
    }
    document.getElementById('topic-list').innerHTML = html;
    
    if (Object.keys(langData).length > 0) {
        const firstPhase = Object.keys(langData)[0];
        const firstTopic = Object.keys(langData[firstPhase])[0];
        loadTopic(firstPhase, firstTopic);
    }
}

function loadTopic(phase, topic) {
    const item = courseData[currentLang][phase][topic];
    document.querySelectorAll('.item-btn').forEach(b => b.classList.remove('active-topic'));
    const btnId = 'btn-' + topic.replace(/\s/g, '').replace(/[&,]/g, '');
    const btn = document.getElementById(btnId);
    if (btn) btn.classList.add('active-topic');

    document.getElementById('explanation').innerHTML = `<h3 style="margin:0; color:#fff">${topic}</h3><p style="color:#94a3b8; font-size:11px; margin-bottom:10px;">${phase}</p>${item.exp}`;
    document.getElementById('editor').value = item.code;
    document.getElementById('output').innerText = "// Ready to practice: " + topic;
}

async function runCode() {
    const out = document.getElementById('output');
    out.innerText = "⏳ Executing...";
    
    const code = document.getElementById('editor').value;
    const langMap = {
        'js': 'nodejs',
        'ts': 'typescript',
        'py': 'python3',
        'go': 'go',
        'zig': 'zig',
        'cs': 'csharp',
        'pg': 'sql',
        'dk': null
    };
    
    const jdoodleLang = langMap[currentLang];
    
    // Languages not supported
    if (!jdoodleLang) {
        out.innerText = `// ${currentLang.toUpperCase()} execution not supported in browser\n// This language requires external infrastructure`;
        return;
    }
    
    // Special handling for JavaScript (run natively for speed)
    if (currentLang === 'js') {
        const log = console.log;
        out.innerText = "";
        console.log = (m) => out.innerText += "> " + (typeof m === 'object' ? JSON.stringify(m) : m) + "\n";
        try { eval(code); } catch(e) { out.innerText = "Error: " + e.message; }
        console.log = log;
        return;
    }
    
    // Use JDoodle API for other languages
    try {
        const response = await fetch('https://api.jdoodle.com/v1/execute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                script: code,
                language: jdoodleLang,
                versionIndex: '0'
            })
        });
        
        const result = await response.json();
        
        if (!response.ok) {
            out.innerText = `API Error: ${response.status}\n${result.message || JSON.stringify(result)}`;
            return;
        }
        
        let output = "";
        
        if (result.error) {
            output = "❌ Error:\n" + result.error;
        } else if (result.output) {
            output = result.output;
        } else {
            output = "(Code executed successfully - no output)";
        }
        
        out.innerText = output.trim() || "(No output)";
    } catch(e) {
        out.innerText = `Execution Error:\n${e.message}\n\nNote: JDoodle may be rate-limited. Try again in a moment.`;
    }
}

// Initializing Academy
setMode('js');
