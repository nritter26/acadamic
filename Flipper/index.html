<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <h2>DB Admin</h2>
            <ul>
                <li class="active">Customers</li>
                <li>Orders</li>
                <li>Settings</li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h1>Customer Management</h1>
                <p>Viewing all registered users in <strong>postgres</strong> database</p>
            </header>
<input type="text" id="searchInput" placeholder="Search by name or email..." onkeyup="filterTable()">
            <section class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email Address</th>
                            <th>Address</th>
                        </tr>
                    </thead>
                    <tbody id="customer-table-body">
                        <!-- Data will be injected here by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // Fetch data from your Node.js API
        fetch('http://localhost:3000/api/customers')
          .then(res => res.json())
          .then(data => {
            const tableBody = document.getElementById('customer-table-body');
            // Map the data into table rows (tr) and cells (td)
            tableBody.innerHTML = data.map(c => `
                <tr>
                    <td>${c.customerid}</td>
                    <td><strong>${c.customername}</strong></td>
                    <td>${c.email}</td>
                    <td>${c.address || 'N/A'}</td>
                </tr>
            `).join('');
          })
          .catch(err => console.error('Error fetching customers:', err));
    </script>
    <script src="app.js"></script>
</body>
</html>
