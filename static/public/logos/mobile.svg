    <circle cx="98" cy="82" r="8"></circle>
    <circle cx="128" cy="82" r="8"></circle>
    <circle cx="158" cy="82" r="8"></circle>

    <circle cx="98" cy="112" r="8"></circle>
    <circle cx="128" cy="112" r="8"></circle>
    <circle cx="158" cy="112" r="8"></circle>

    <circle cx="98" cy="142" r="8"></circle>
    <circle cx="128" cy="142" r="8"></circle>
    <circle cx="158" cy="142" r="8"></circle>
  </g>
</svg>